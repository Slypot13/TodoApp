# Base PostgreSQL locale, même version majeure qu'en production.
#   docker compose up -d     -> démarre la base
#   docker compose down -v   -> l'arrête et efface les données
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
