<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
</head>
<body>
  <div class="container">
    <h1>VERSION CASSÉE</h1>

    <div class="carousel">
      <img id="carouselImage" src="/images/img1.png" alt="Image drôle">
    </div>

    <form class="form-zone" id="taskForm">
      <input type="text" id="taskInput" placeholder="Nouvelle tâche">
      <button type="submit">Ajouter</button>
    </form>

    <p id="errorMessage"></p>

    <ul id="taskList"></ul>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
